main:
  push:
    - name: sync-to-github
      imports:
        - https://cnb.cool/aoobee/aoobee-secrets/-/blob/main/limingdao-cnb-sync.yml
      stages:
        - name: sync
          script: |
            set -e
            SRC_HEAD=$(git rev-parse HEAD)
            echo "SRC_HEAD=$SRC_HEAD"
            GH_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/aoocar/toolify-directory-static.git"
            echo "== push CNB main -> GitHub main =="
            git push "$GH_URL" main:main
            DST_HEAD=$(git ls-remote "$GH_URL" refs/heads/main | cut -f1)
            echo "DST_HEAD=$DST_HEAD"
            if [ "$SRC_HEAD" = "$DST_HEAD" ]; then
              echo "SYNC_OK: CNB main 已同步到 GitHub main"
            else
              echo "SYNC_WARN: push 完成但 SHA 不一致，请检查"
              exit 1
            fi
        - name: indexnow
          # 外链建设 / 收录加速（P0）：同步 GitHub 后向 IndexNow（Bing/百度/Yandex）
          # 主动推送核心 URL，加速爬虫发现新站。key 文件 public/<KEY>.txt 已随本仓部署。
          script: |
            set -e
            python3 scripts/indexnow-submit.py --limit 200 || echo "INDEXNOW_WARN: 推送失败（不阻断部署，可稍后手动重跑）"

  # ============================================================
  # GSC 数据导出 + 关键词审计 + AI 可见性复测 流水线（复用锚点）
  # 两种触发方式共用同一套定义：
  #   1) crontab  每月 1 日 02:30 自动执行
  #   2) api_trigger  手动一键触发（随时拉最新 28 天数据）
  # 使用 python:3.11 镜像（默认镜像无 python3/pip3）
  # ============================================================
  "crontab: 30 2 1 * *":
    - &gsc-monthly-export-audit
      name: gsc-monthly-export-audit
      docker:
        image: python:3.11
      imports:
        - https://cnb.cool/aoobee/aoobee-secrets/-/blob/main/gen-lang-client-0803005687-0f2590780ae7.json
      env:
        GSC_SITE_KEYWORD: limingdao
        GSC_DAYS: "28"
      stages:
        - name: install
          script: |
            set -e
            pip3 install -q --no-cache-dir google-api-python-client google-auth pyyaml 2>&1 | tail -1 || true
            python3 --version
        - name: export
          script: |
            set -e
            python3 scripts/gsc-export.py --days ${GSC_DAYS} --site "${GSC_SITE_KEYWORD}" --out-dir gsc/export
        - name: keyword-map
          script: |
            set -e
            python3 scripts/gsc-keyword-map.py
        - name: audit
          script: |
            set -e
            python3 scripts/gsc-audit.py --queries gsc/export/queries.csv --pages gsc/export/pages.csv
        - name: ai-visibility
          # 月度 AI 可见性复测（随 GSC 审计一起跑）：Common Crawl 语料覆盖 + 搜索引擎品牌词露出
          # 目标：2 个月内 Common Crawl 覆盖新站 ≥ 1 批次。结果入库留档用于月度趋势对比。
          script: |
            set -e
            mkdir -p geo/monthly
            OUT="geo/monthly/ai-visibility-$(date +%Y-%m).md"
            {
              echo "# 黎明岛 AI 可见性月度复测"
              echo ""
              echo "> 复测时间：$(date '+%Y-%m-%d %H:%M:%S %Z')"
              echo "> 方法：Common Crawl CDX 索引覆盖计数 + 360/必应品牌词露出（详见 scripts/check_ai_visibility.py）"
              echo "> 目标：2 个月内 CC 覆盖新站 ≥ 1 批次"
              echo ""
              python3 scripts/check_ai_visibility.py 2>&1
            } > "$OUT"
            echo "AI 可见性复测完成：$OUT"
            tail -15 "$OUT"
        - name: commit-and-push
          script: |
            set -e
            cd /workspace
            git config user.email "cnb.c4ejfLqtAfAA@noreply.cnb.cool"
            git config user.name "cnb.c4ejfLqtAfAA"
            git add gsc/export/queries.csv gsc/export/pages.csv gsc/keyword-map.csv gsc/audit-report.md gsc/uncovered-queries.csv geo/monthly/*.md
            git commit -m "chore(gsc): 导出 GSC 数据 + 关键词审计报告 + AI 可见性复测（$(date +%Y-%m-%d)）" || echo "NOTHING_TO_COMMIT"
            git push "https://cnb:${CNB_TOKEN}@cnb.cool/aoobee/limingdao.git" HEAD:main 2>&1 | tail -3 || echo "PUSH_FAILED"

$:
  # 手动触发：随时一键拉最新 GSC 数据（复用上方 crontab 同一套流水线定义）
  api_trigger:
    - *gsc-monthly-export-audit
